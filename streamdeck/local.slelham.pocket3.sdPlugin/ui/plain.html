<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Pocket3 Companion</title>
  <style>
    html, body { margin: 0; padding: 12px 16px; background: #2d2d2d; color: #e8e8e8; font: 13px/1.4 -apple-system, BlinkMacSystemFont, sans-serif; }
    p { margin: 0; color: #bdbdbd; }
  </style>
</head>
<body>
  <p id="note">Pair this Mac from Pocket3 Companion, in Preset tools. Recenter walks to the saved center. Stop drops pan, tilt, and zoom that have not been sent.</p>
  <script>
    function connectElgatoStreamDeckSocket(inPort, inUUID, inRegisterEvent) {
      var websocket = new WebSocket("ws://127.0.0.1:" + inPort);
      websocket.onopen = function () {
        websocket.send(JSON.stringify({ event: inRegisterEvent, uuid: inUUID }));
      };
    }
  </script>
</body>
</html>
